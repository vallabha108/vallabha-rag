[project]
name = "vallabha-rag"
version = "0.1.0"
description = "Vertex AI RAG Engine corpus management for the Vallabha VLE project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.1.5",
    "google-cloud-aiplatform>=1.163.0",
    "google-genai>=2.17.0",
    "ollama>=0.6.2",
    "opik>=2.2.23",
    "openai-whisper>=20250625",
    "chromadb>=1.0.0",
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
rag = "rag_cli:main"
audiorag = "audio_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that use real models/servers (run with: uv run pytest -m integration)",
]

[tool.hatch.build.targets.wheel]
only-include = ["rag_cli.py", "rag_eval.py", "rag_report.py", "audio_rag"]
